<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KopyCat is offline</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f0e6; color: #152c2a; font-family: "Avenir Next", "Segoe UI", sans-serif; padding: calc(24px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom)); }
      main { max-width: 440px; text-align: center; }
      .mark { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 42px 42px 42px 14px; background: #ff6e55; color: white; display: grid; place-items: center; font: 600 42px Georgia, serif; }
      h1 { font: 500 36px Georgia, serif; margin: 0 0 10px; }
      p { line-height: 1.55; }
      button { min-height: 44px; margin-top: 8px; background: #152c2a; color: white; border: 0; border-radius: 7px; padding: 12px 18px; font: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">K</div>
      <h1>You're offline</h1>
      <p>KopyCat needs a connection to open your profile, KopyPaks, and leads. Check Wi-Fi or cellular data, then try again.</p>
      <p>Cards you already programmed still open in a browser when the other person has a connection. They do not need this app.</p>
      <button type="button" onclick="location.replace('https://www.kopycat.app/dashboard')">Try again</button>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KopyCat</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f0e6; color: #152c2a; font-family: "Avenir Next", "Segoe UI", sans-serif; padding: 32px 20px calc(32px + env(safe-area-inset-bottom)); }
      main { max-width: 420px; text-align: center; }
      .mark { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 42px 42px 42px 14px; background: #ff6e55; color: white; display: grid; place-items: center; font: 600 42px Georgia, serif; }
      h1 { font: 500 40px Georgia, serif; margin: 0 0 8px; }
      p { line-height: 1.5; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 12px; background: #ff6e55; color: white; text-decoration: none; font-weight: 800; border-radius: 7px; padding: 12px 18px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">K</div>
      <h1>KopyCat</h1>
      <p>Tap it. Kopy it. Keep it.</p>
      <p>This screen is the local shell. The app opens your KopyPaks from kopycat.app.</p>
      <a href="https://www.kopycat.app/dashboard">Open KopyCat</a>
    </main>
  </body>
</html>
